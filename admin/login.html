<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MakerHub MM — Admin Gateway</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <script>
      // ⚡ Immediate Root Attribute Injector matching your :root[data-theme] tokens
      (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>
  </head>
  <body
    class="admin-login-body d-flex align-items-center justify-content-center"
    style="height: 100vh; overflow: hidden"
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
          <div class="text-center mb-4">
            <i
              class="bi bi-cpu fs-1"
              style="color: var(--neon-green) !important"
            ></i>
            <h3 class="fw-bold mt-2">MakerHub MM</h3>
            <p
              class="text-muted-custom small text-uppercase"
              style="letter-spacing: 0.5px"
            >
              Admin Command Gateway
            </p>
          </div>

          <div class="card login-card-custom p-4">
            <form id="adminLoginForm" onsubmit="handleAdminGatewayLogin(event)">
              <div class="mb-3">
                <label class="form-label small fw-semibold text-muted-custom"
                  >Administrative Email</label
                >
                <div class="input-group">
                  <span
                    class="input-group-text input-group-text-custom border-end-0"
                  >
                    <i class="bi bi-envelope"></i>
                  </span>
                  <input
                    type="email"
                    id="adminEmail"
                    class="form-control form-control-custom border-start-0"
                    placeholder="admin@makerhub.com"
                    required
                    autocomplete="off"
                  />
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label small fw-semibold text-muted-custom"
                  >Security Password</label
                >
                <div class="input-group">
                  <span
                    class="input-group-text input-group-text-custom border-end-0"
                  >
                    <i class="bi bi-key"></i>
                  </span>
                  <input
                    type="password"
                    id="adminPassword"
                    class="form-control form-control-custom border-start-0"
                    placeholder="••••••••"
                    required
                  />
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-neon-gateway w-100 py-2 fw-bold"
                id="loginBtn"
              >
                <i class="bi bi-box-arrow-in-right me-2"></i>Verify & Enter
              </button>
            </form>
          </div>

          <div class="text-center mt-4">
            <a
              href="../index.html"
              class="text-decoration-none text-muted-custom small"
              ><i class="bi bi-arrow-left me-1"></i> Back to Public Platform</a
            >
          </div>
        </div>
      </div>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
